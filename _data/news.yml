- date: March 2026
  headline: "Rami, Katie, Stela, and Rania at the EMU GRCAC 2026 Symposium, where the lab delivered a whopping five presentations, an incredibly proud moment for the entire team!" ![image](/images/newspic/GRCAC2026.png){:class="img-responsive" width="400px"}


- date: February 2026
  headline: "Katie chaired her first session at the ACM SIGCSE 2026 Technical Symposium! A proud and well-deserved milestone." ![image](/images/newspic/KT_SIGCSE26.png){:class="img-responsive" width="400px"}


- date: September 2025
  headline: "Our paper “'Are We Going To Crash?': The Effect of an AI Presence in User Experience during a VR Flight” has been accepted for publication in ISVC 2025. Congratulations to Katie for leading the project, and William and Rami for their first conference publication!"


- date: July 2025
  headline: "Our paper “Planogen: A Procedural Generation Framework for Dynamic VR Research Environments” has been published in the MDPI Virtual Worlds journal."


- date: February 2025
  headline: Our paper “Impact of GPT-Driven Teaching Assistants in VR Learning Environments” has been accepted as a regular paper in an upcoming issue of IEEE Transactions on Learning Technologies. Congratulations to Katie for her first first-author paper!


- date: December 2024
  headline: Katie defended her master's thesis and will join the EAS Lab as a Research Associate next semester!


- date: October 2024
  headline: Presented our work at ISVC 2024 in Lake Tahoe! Many congratulations to Jorde for all his hard work. ![image](/images/newspic/isvc24_eas.jpg){:class="img-responsive" width="400px"}


- date: October 2024
  headline: Thanks to the James H. Brickley Endowment for Faculty Professional Development and Innovation grant, our lab is officially starting!
